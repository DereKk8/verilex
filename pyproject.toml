[project]
name = "verilex"
version = "0.1.0"
description = "Chain product verification words, Unix-pipe style, inside a trust frame"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
verilex = "verilex.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
